name: Rattrapage Claude (manuel)

# Classe les metas et rédige les fiches des journaux passés (sans recalculer les journaux).
# Consomme le quota de l'abonnement Claude : environ 2 à 4 minutes de Claude Code par journal.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Premier journal (AAAA-MM-JJ)"
        required: true
      days:
        description: "Nombre de jours"
        required: true
        default: "7"
      fiches:
        description: "Rédiger aussi les fiches des coins retenus"
        type: boolean
        default: true

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vérification des secrets et des connexions
        run: npm run check:env
      - run: npm run db:migrate
      - name: Installer Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Journaux un par un (du plus ancien au plus récent, pour les taux glissants)
        run: |
          for i in $(seq 0 $(( ${{ inputs.days }} - 1 ))); do
            export JOURNAL_DATE=$(date -u -d "${{ inputs.from }} + $i day" +%F)
            echo "::group::Journal du $JOURNAL_DATE"
            rm -f work/*.json
            npm run claude:export -- --step classement && bash pipeline/claude/run.sh classement 30 || true
            npm run claude:ingest -- --step classement
            if [ "${{ inputs.fiches }}" = "true" ]; then
              npm run claude:export -- --step fiches && bash pipeline/claude/run.sh fiches 160 || true
              npm run claude:ingest -- --step fiches
            fi
            npm run stats
            echo "::endgroup::"
          done
      - name: Second cerveau (liens factuels puis liens de sens de tous les coins)
        run: |
          npm run links
          npm run claude:export -- --step liens && bash pipeline/claude/run.sh liens 60 || true
          npm run claude:ingest -- --step liens
